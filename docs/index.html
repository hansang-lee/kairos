<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Daily Macro Regime Analysis Dashboard — Detailed Indicator Breakdown and Market Commentary">
    <title>Macro Regime Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0e1a;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.15);

            --expansion: #34d399;
            --overheating: #f97316;
            --slowdown: #fbbf24;
            --recession: #f87171;

            --stocks: #818cf8;
            --gold: #fbbf24;
            --metals: #a78bfa;
            --bonds: #38bdf8;
            --cash: #6ee7b7;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, var(--accent), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .updated-at {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            backdrop-filter: blur(12px);
            transition: background 0.2s;
        }

        .card:hover {
            background: var(--surface-hover);
        }

        .card-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        /* Commentary */
        .commentary {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text);
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            margin-top: 0.5rem;
        }

        /* Regime Badge */
        .regime-section {
            text-align: center;
        }

        .regime-badge {
            display: inline-block;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 0.6rem 2rem;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .regime-badge.expansion {
            background-color: var(--expansion);
        }

        .regime-badge.overheating {
            background-color: var(--overheating);
        }

        .regime-badge.slowdown {
            background-color: var(--slowdown);
        }

        .regime-badge.recession {
            background-color: var(--recession);
        }

        .composite-score {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .composite-score span {
            font-weight: 600;
            color: var(--text);
        }

        /* Score Bars */
        .score-row {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .score-row:last-child {
            margin-bottom: 0;
        }

        .score-label {
            width: 90px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .score-track {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .score-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .score-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 20px;
            height: 100%;
            background: inherit;
            filter: blur(6px);
            opacity: 0.6;
        }

        .score-value {
            width: 45px;
            text-align: right;
            font-size: 0.82rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }

        /* Score color coding */
        .score-fill.growth {
            background: linear-gradient(90deg, #34d399, #6ee7b7);
        }

        .score-fill.inflation {
            background: linear-gradient(90deg, #f97316, #fb923c);
        }

        .score-fill.liquidity {
            background: linear-gradient(90deg, #38bdf8, #7dd3fc);
        }

        .score-fill.sentiment {
            background: linear-gradient(90deg, #a78bfa, #c4b5fd);
        }

        .score-fill.risk {
            background: linear-gradient(90deg, #f87171, #fca5a5);
        }

        /* Indicator Grid */
        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .indicator-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .indicator-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .indicator-value {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .indicator-change {
            font-size: 0.75rem;
            font-weight: 500;
        }

        .change-up {
            color: var(--expansion);
        }

        .change-down {
            color: var(--recession);
        }

        .change-neutral {
            color: var(--text-muted);
        }

        /* Allocation Ring */
        .alloc-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .donut-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            flex-shrink: 0;
        }

        .donut-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .donut-svg circle {
            fill: transparent;
            stroke-width: 28;
            transition: stroke-dasharray 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .alloc-legend {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .legend-name {
            color: var(--text-muted);
            width: 60px;
        }

        .legend-pct {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* FNG */
        .fng-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .fng-score {
            font-size: 2.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .fng-meta {
            display: flex;
            flex-direction: column;
        }

        .fng-rating {
            font-size: 1rem;
            font-weight: 600;
        }

        .fng-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .fng-bar {
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg,
                    #f87171 0%, #f87171 25%,
                    #fbbf24 25%, #fbbf24 45%,
                    #94a3b8 45%, #94a3b8 55%,
                    #34d399 55%, #34d399 75%,
                    #38bdf8 75%, #38bdf8 100%);
            border-radius: 4px;
            margin-top: 2.5rem;
            /* Space for arrow/label above */
            position: relative;
            /* Ruler Ticks */
            background-image:
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.4) 0, rgba(255, 255, 255, 0.4) 1px, transparent 1px, transparent 10%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.15) 0, rgba(255, 255, 255, 0.15) 1px, transparent 1px, transparent 2%),
                linear-gradient(90deg,
                    #f87171 0%, #f87171 25%,
                    #fbbf24 25%, #fbbf24 45%,
                    #94a3b8 45%, #94a3b8 55%,
                    #34d399 55%, #34d399 75%,
                    #38bdf8 75%, #38bdf8 100%);
            background-size: 100% 100%, 100% 60%, 100% 100%;
            background-position: center;
            background-repeat: repeat-x;
        }

        .fng-indicator {
            position: absolute;
            top: -12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateX(-50%);
            transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .fng-arrow {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 9px solid #fff;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 0;
            color: var(--text-muted);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-msg {
            text-align: center;
            padding: 2rem;
            color: var(--recession);
            font-size: 0.9rem;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.72rem;
            color: var(--text-muted);
            opacity: 0.6;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Portfolio */
        .portfolio-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .portfolio-value {
            font-size: 2.1rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .portfolio-delta {
            font-size: 1rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            margin-top: 0.25rem;
        }

        .portfolio-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: right;
            line-height: 1.7;
        }

        .portfolio-meta b {
            color: var(--text);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .chart-wrap {
            position: relative;
            width: 100%;
        }

        .stock-chart {
            width: 100%;
            height: 280px;
            display: block;
            overflow: visible;
        }

        .chart-grid-line {
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 1;
        }

        .chart-base-line {
            stroke: var(--text-muted);
            stroke-width: 1;
            stroke-dasharray: 5 5;
            opacity: 0.55;
        }

        .chart-axis-label {
            fill: var(--text-muted);
            font-size: 10px;
            font-variant-numeric: tabular-nums;
        }

        .chart-line {
            fill: none;
            stroke-width: 2;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .chart-crosshair {
            stroke: var(--text-muted);
            stroke-width: 1;
            stroke-dasharray: 3 3;
            opacity: 0;
        }

        .chart-hover-dot {
            opacity: 0;
        }

        .chart-tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(10, 14, 26, 0.95);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.45rem 0.6rem;
            font-size: 0.72rem;
            line-height: 1.5;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.12s;
            transform: translate(-50%, -130%);
            font-variant-numeric: tabular-nums;
            z-index: 5;
        }

        .chart-range {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.75rem;
            justify-content: flex-end;
        }

        .range-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
            font-size: 0.72rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }

        .range-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .range-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text);
        }

        .holdings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .holdings-table th {
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.05em;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .holdings-table td {
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .holdings-table td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .holdings-table tbody tr:last-child td {
            border-bottom: none;
        }

        .strategy-tag {
            display: inline-block;
            font-size: 0.68rem;
            padding: 0.15rem 0.45rem;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            margin-left: 0.35rem;
        }

        .empty-msg {
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 1.5rem 0;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .alloc-container {
                flex-direction: column;
                gap: 1.5rem;
            }

            header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Macro Regime Report</h1>
            <div class="updated-at" id="updatedAt">Loading...</div>
        </header>

        <div id="portfolio"></div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading report data...</p>
            </div>
        </div>

        <footer>
            Powered by <a href="https://fred.stlouisfed.org/" target="_blank">FRED</a> &amp;
            <a href="https://edition.cnn.com/markets/fear-and-greed" target="_blank">CNN Fear &amp; Greed</a>
            &mdash; 매크로: GitHub Actions 일 1회 &middot; 모의투자: 로컬 대시보드 서버 실시간
        </footer>
    </div>

    <script>
        (async function () {
            const $content = document.getElementById('content');
            const $portfolio = document.getElementById('portfolio');
            const $updated = document.getElementById('updatedAt');

            let rangeMinutes = 0;          // 0 = ALL
            let portfolioState = { p: null, history: [] };
            const REFRESH_MS = 30000;

            try {
                const resp = await fetch('data.json');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                render(data);
            } catch (e) {
                $content.innerHTML = `<div class="error-msg">Failed to load data: ${e.message}</div>`;
            }

            // Portfolio data: prefer the live local server (/live/), fall back to the
            // static files. Never let its absence break the macro report below.
            async function loadJson(paths) {
                for (const path of paths) {
                    try {
                        const resp = await fetch(path + '?t=' + Date.now());
                        if (resp.ok) return await resp.json();
                    } catch (e) { /* try the next path */ }
                }
                return null;
            }

            async function loadPortfolio() {
                const p = await loadJson(['live/portfolio.json', 'portfolio.json']);
                if (!p || !p.success) return;
                const history = (await loadJson(['live/portfolio_history.json', 'portfolio_history.json'])) || [];
                renderPortfolio(p, history);
            }

            await loadPortfolio();
            setInterval(loadPortfolio, REFRESH_MS);

            function render(d) {
                /* Timestamp */
                const ts = new Date(d.timestamp);
                $updated.textContent = `Last updated: ${ts.toLocaleString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
                })}`;

                /* Build HTML */
                const regime = d.regime.toLowerCase();
                const scores = d.scores;
                const alloc = d.allocation;
                const fng = d.fng;
                const details = d.details || {};
                const summary = d.summary || "No commentary available for this update.";

                const scoreCategories = [
                    { key: 'growth', label: 'Growth', cls: 'growth' },
                    { key: 'inflation', label: 'Inflation', cls: 'inflation' },
                    { key: 'liquidity', label: 'Liquidity', cls: 'liquidity' },
                    { key: 'sentiment', label: 'Sentiment', cls: 'sentiment' },
                    { key: 'risk', label: 'Risk', cls: 'risk' },
                ];

                const scoreBars = scoreCategories.map(s => `
                <div class="score-row">
                    <div class="score-label">${s.label}</div>
                    <div class="score-track">
                        <div class="score-fill ${s.cls}" style="width: ${scores[s.key]}%"></div>
                    </div>
                    <div class="score-value">${scores[s.key].toFixed(1)}</div>
                </div>
            `).join('');

                /* Donut chart */
                const allocEntries = [
                    { key: 'stocks', label: 'Stocks', color: 'var(--stocks)' },
                    { key: 'gold', label: 'Gold', color: 'var(--gold)' },
                    { key: 'metals', label: 'Metals', color: 'var(--metals)' },
                    { key: 'bonds', label: 'Bonds', color: 'var(--bonds)' },
                    { key: 'cash', label: 'Cash', color: 'var(--cash)' },
                ].filter(a => alloc[a.key] > 0);

                const radius = 76;
                const circumference = 2 * Math.PI * radius;
                let cumulativeOffset = 0;

                const circles = allocEntries.map(a => {
                    const pct = alloc[a.key] / 100;
                    const dashLen = pct * circumference;
                    const gap = circumference - dashLen;
                    const offset = -cumulativeOffset;
                    cumulativeOffset += dashLen;
                    return `<circle cx="90" cy="90" r="${radius}"
                    stroke="${a.color}" stroke-dasharray="${dashLen} ${gap}"
                    stroke-dashoffset="${offset}" />`;
                }).join('');

                const legendItems = allocEntries.map(a => `
                <div class="legend-item">
                    <div class="legend-dot" style="background:${a.color}"></div>
                    <div class="legend-name">${a.label}</div>
                    <div class="legend-pct">${alloc[a.key]}%</div>
                </div>
            `).join('');

                /* Indicators */
                const indicators = [
                    { label: 'Unemployment', key: 'unrate', unit: '%', higherIsBetter: false },
                    { label: 'Payroll (Job)', key: 'payems', unit: 'k', higherIsBetter: true },
                    { label: 'CPI (Inf.)', key: 'cpi_annual', unit: '%', higherIsBetter: false },
                    { label: 'Fed Funds', key: 'fedfunds', unit: '%', higherIsBetter: null },
                    { label: 'Yield Curve', key: 'yield_curve', unit: '', higherIsBetter: true },
                    { label: 'HY Spread', key: 'hy_spread', unit: '', higherIsBetter: false },
                    { label: 'Ind. Production', key: 'indpro', unit: '', higherIsBetter: true },
                ];

                const indicatorHTML = indicators.map(ind => {
                    const data = details[ind.key];
                    if (!data) return '';
                    const formatVal = ind.unit === '%' ? data.value.toFixed(2) : data.value.toFixed(2);
                    const formatChg = data.change > 0 ? `+${data.change.toFixed(2)}` : data.change.toFixed(2);

                    let changeClass = 'change-neutral';
                    if (ind.higherIsBetter !== null) {
                        if (data.change > 0) changeClass = ind.higherIsBetter ? 'change-up' : 'change-down';
                        else if (data.change < 0) changeClass = ind.higherIsBetter ? 'change-down' : 'change-up';
                    }

                    return `
                    <div class="indicator-card">
                        <div class="indicator-label">${ind.label}</div>
                        <div class="indicator-value">${formatVal}${ind.unit}</div>
                        <div class="indicator-change ${changeClass}">${formatChg}</div>
                    </div>
                `;
                }).join('');

                /* FNG */
                let fngHTML = '';
                if (fng) {
                    const fngColor = fngScoreColor(fng.score);
                    fngHTML = `
                <div class="card">
                    <div class="card-title">Fear &amp; Greed Index</div>
                    <div class="fng-section">
                        <div class="fng-score" style="color:${fngColor}">${Math.round(fng.score)}</div>
                        <div class="fng-meta">
                            <div class="fng-rating" style="color:${fngColor}">${fng.rating || ''}</div>
                            <div class="fng-label">CNN Fear &amp; Greed</div>
                        </div>
                    </div>
                    <div class="fng-bar">
                        <div class="fng-indicator" style="left:${fng.score}%">
                            <div class="fng-arrow"></div>
                        </div>
                    </div>
                </div>`;
                }

                $content.innerHTML = `
                <div class="card">
                    <div class="card-title">Market Commentary</div>
                    <p class="commentary">${summary}</p>
                </div>

                <div class="card regime-section">
                    <div class="card-title">Current Regime</div>
                    <div class="regime-badge ${regime}">${d.regime}</div>
                    <div class="composite-score">Composite Score: <span>${scores.composite.toFixed(1)}</span> / 100</div>
                </div>

                <div class="grid-2">
                    <div class="card">
                        <div class="card-title">Macro Scores</div>
                        ${scoreBars}
                    </div>

                    <div class="card">
                        <div class="card-title">Recommended Allocation</div>
                        <div class="alloc-container">
                            <div class="donut-wrapper">
                                <svg class="donut-svg" viewBox="0 0 180 180">
                                    ${circles}
                                </svg>
                            </div>
                            <div class="alloc-legend">
                                ${legendItems}
                            </div>
                        </div>
                    </div>
                </div>

                ${fngHTML}

                <div class="card">
                    <div class="card-title">Analysis Breakdown</div>
                    <div class="indicator-grid">
                        ${indicatorHTML}
                    </div>
                </div>
            `;
            }

            function renderPortfolio(p, history) {
                portfolioState = { p, history };
                const principal = p.initial_capital_krw || 0;
                const total = p.total_eval_krw || 0;
                const returnPct = p.total_return_pct || 0;
                const gain = total - principal;
                const cls = returnPct >= 0 ? 'change-up' : 'change-down';
                const sign = returnPct >= 0 ? '+' : '';
                const asOf = p.timestamp ? new Date(p.timestamp).toLocaleString('ko-KR', {
                    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                }) : '';

                $portfolio.innerHTML = `
                <div class="card">
                    <div class="card-title">모의투자 현황 (KRX · 한투 모의계좌)</div>
                    <div class="portfolio-head">
                        <div>
                            <div class="portfolio-value">${Math.round(total).toLocaleString()}<span style="font-size:1rem;color:var(--text-muted)"> 원</span></div>
                            <div class="portfolio-delta ${cls}">${sign}${Math.round(gain).toLocaleString()}원 (${sign}${returnPct.toFixed(2)}%)</div>
                        </div>
                        <div class="portfolio-meta">
                            원금 <b>${Math.round(principal).toLocaleString()}원</b><br>
                            예수금 <b>${Math.round(p.cash_balance_krw || 0).toLocaleString()}원</b><br>
                            ${asOf ? `기준 ${asOf}` : ''}
                        </div>
                    </div>
                    <div class="chart-wrap" id="chartWrap">
                        ${buildStockChart(history, principal)}
                        <div class="chart-tooltip" id="chartTooltip"></div>
                    </div>
                    ${history && history.length > 1 ? `
                    <div class="chart-range">
                        ${[['1H', 60], ['6H', 360], ['1D', 1440], ['ALL', 0]].map(([label, mins]) =>
                            `<button class="range-btn ${rangeMinutes === mins ? 'active' : ''}" data-range="${mins}">${label}</button>`
                        ).join('')}
                    </div>` : ''}
                </div>
                <div class="card">
                    <div class="card-title">보유 종목</div>
                    ${buildHoldingsTable(p.holdings, total)}
                </div>`;

                attachChartHandlers(history, principal);
            }

            function filterHistory(history) {
                if (!history || !rangeMinutes) return history || [];
                const cutoff = (Date.now() / 1000) - rangeMinutes * 60;
                const filtered = history.filter(h => (h.ts || 0) >= cutoff);
                return filtered.length >= 2 ? filtered : history.slice(-2);
            }

            function buildStockChart(rawHistory, principal) {
                const history = filterHistory(rawHistory);
                if (!history || history.length === 0) {
                    return '<p class="empty-msg">아직 기록이 없습니다 — 대시보드 서버가 돌기 시작하면 쌓입니다.</p>';
                }

                const W = 760, H = 280;
                const padL = 70, padR = 14, padT = 14, padB = 26;
                const plotW = W - padL - padR;
                const plotH = H - padT - padB;

                const values = history.map(h => h.total_eval_krw);
                let minV = Math.min(principal, ...values);
                let maxV = Math.max(principal, ...values);
                if (maxV === minV) { maxV = minV + 1; }
                const headroom = (maxV - minV) * 0.12;
                minV -= headroom;
                maxV += headroom;

                const n = history.length;
                const x = i => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
                const y = v => padT + (1 - (v - minV) / (maxV - minV)) * plotH;

                const last = history[n - 1];
                const up = last.total_eval_krw >= principal;
                const color = up ? 'var(--expansion)' : 'var(--recession)';
                const rawColor = up ? '#34d399' : '#f87171';

                /* Y grid + labels */
                const ticks = 4;
                let grid = '';
                for (let t = 0; t <= ticks; t++) {
                    const v = minV + (maxV - minV) * (t / ticks);
                    const yy = y(v);
                    grid += `<line class="chart-grid-line" x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" />`;
                    grid += `<text class="chart-axis-label" x="${padL - 8}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${Math.round(v / 10000).toLocaleString()}만</text>`;
                }

                /* X labels: first / middle / last */
                const labelIdx = n === 1 ? [0] : [0, Math.floor((n - 1) / 2), n - 1];
                const xLabels = labelIdx.map(i => {
                    const t = history[i].time || '';
                    const short = t.length >= 16 ? t.slice(5) : t;
                    const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
                    return `<text class="chart-axis-label" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${anchor}">${short}</text>`;
                }).join('');

                const linePts = history.map((h, i) => `${x(i).toFixed(1)},${y(h.total_eval_krw).toFixed(1)}`).join(' ');
                const baseY = y(principal);
                const areaPts = `${x(0).toFixed(1)},${baseY.toFixed(1)} ${linePts} ${x(n - 1).toFixed(1)},${baseY.toFixed(1)}`;

                return `
                <svg class="stock-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="stockChart">
                    <defs>
                        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="${rawColor}" stop-opacity="0.28" />
                            <stop offset="100%" stop-color="${rawColor}" stop-opacity="0.02" />
                        </linearGradient>
                    </defs>
                    ${grid}
                    <polygon points="${areaPts}" fill="url(#areaGrad)" />
                    <line class="chart-base-line" x1="${padL}" y1="${baseY.toFixed(1)}" x2="${W - padR}" y2="${baseY.toFixed(1)}" />
                    <text class="chart-axis-label" x="${W - padR}" y="${(baseY - 5).toFixed(1)}" text-anchor="end">원금</text>
                    <polyline points="${linePts}" class="chart-line" style="stroke:${color}" />
                    <circle cx="${x(n - 1).toFixed(1)}" cy="${y(last.total_eval_krw).toFixed(1)}" r="4" fill="${color}" />
                    <line class="chart-crosshair" id="crosshair" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" />
                    <circle class="chart-hover-dot" id="hoverDot" r="4" fill="${color}" stroke="var(--bg)" stroke-width="2" />
                    ${xLabels}
                </svg>`;
            }

            function attachChartHandlers(rawHistory, principal) {
                const svg = document.getElementById('stockChart');
                const wrap = document.getElementById('chartWrap');
                const tip = document.getElementById('chartTooltip');
                const cross = document.getElementById('crosshair');
                const dot = document.getElementById('hoverDot');

                document.querySelectorAll('.range-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        rangeMinutes = Number(btn.dataset.range);
                        renderPortfolio(portfolioState.p, portfolioState.history);
                    });
                });

                if (!svg || !wrap || !tip || !cross || !dot) return;

                const history = filterHistory(rawHistory);
                const n = history.length;
                if (n === 0) return;

                const W = 760, padL = 70, padR = 14, plotW = W - padL - padR;

                svg.addEventListener('mousemove', ev => {
                    const rect = svg.getBoundingClientRect();
                    const relX = (ev.clientX - rect.left) / rect.width * W;
                    let i = n === 1 ? 0 : Math.round((relX - padL) / plotW * (n - 1));
                    i = Math.max(0, Math.min(n - 1, i));
                    const h = history[i];

                    const px = n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
                    const pxRatio = px / W;
                    cross.setAttribute('x1', px);
                    cross.setAttribute('x2', px);
                    cross.style.opacity = '0.6';

                    const cy = Number(svg.querySelector('.chart-line').getAttribute('points').split(' ')[i].split(',')[1]);
                    dot.setAttribute('cx', px);
                    dot.setAttribute('cy', cy);
                    dot.style.opacity = '1';

                    const gain = h.total_eval_krw - principal;
                    const gCls = gain >= 0 ? 'change-up' : 'change-down';
                    const gSign = gain >= 0 ? '+' : '';
                    tip.innerHTML = `<div style="color:var(--text-muted)">${h.time || ''}</div>
                        <div><b>${Math.round(h.total_eval_krw).toLocaleString()}원</b></div>
                        <div class="${gCls}">${gSign}${Math.round(gain).toLocaleString()}원 (${gSign}${(h.total_return_pct || 0).toFixed(2)}%)</div>`;
                    tip.style.left = (pxRatio * rect.width) + 'px';
                    tip.style.top = (cy / 280 * rect.height) + 'px';
                    tip.style.opacity = '1';
                });

                svg.addEventListener('mouseleave', () => {
                    tip.style.opacity = '0';
                    cross.style.opacity = '0';
                    dot.style.opacity = '0';
                });
            }

            function buildHoldingsTable(holdings, total) {
                if (!holdings || holdings.length === 0) {
                    return '<p class="empty-msg">보유 종목 없음 — 아직 체결된 주문이 없습니다.</p>';
                }

                const rows = holdings.map(h => {
                    const pl = h.profit_loss_pct || 0;
                    const plClass = pl > 0 ? 'change-up' : pl < 0 ? 'change-down' : 'change-neutral';
                    const sign = pl > 0 ? '+' : '';
                    const strategy = h.strategy_name
                        ? `${h.strategy_name}${h.category ? `<span class="strategy-tag">${h.category}</span>` : ''}`
                        : '<span style="color:var(--text-muted)">—</span>';
                    return `
                    <tr>
                        <td>${h.ticker}</td>
                        <td>${h.name || ''}</td>
                        <td>${strategy}</td>
                        <td class="num">${h.quantity}</td>
                        <td class="num">${Math.round(h.avg_price).toLocaleString()}</td>
                        <td class="num">${Math.round(h.current_price).toLocaleString()}</td>
                        <td class="num ${plClass}">${sign}${pl.toFixed(2)}%</td>
                        <td class="num">${(h.weight_pct || 0).toFixed(1)}%</td>
                    </tr>`;
                }).join('');

                return `
                <table class="holdings-table">
                    <thead>
                        <tr><th>종목</th><th>이름</th><th>전략</th><th>수량</th><th>매입가</th><th>현재가</th><th>손익률</th><th>비중</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
            }

            function fngScoreColor(score) {
                if (score < 25) return '#f87171'; // Extreme Fear
                if (score < 45) return '#fbbf24'; // Fear
                if (score <= 55) return '#94a3b8'; // Neutral
                if (score <= 75) return '#34d399'; // Greed
                return '#38bdf8'; // Extreme Greed
            }
        })();
    </script>
</body>

</html>
